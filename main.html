<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Glassmorphism</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Phosphor Icons - Nhẹ và đẹp) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- RESET & CÀI ĐẶT CƠ BẢN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29; /* Fallback */
            /* Gradient nền tối hiện đại: Tím than -> Xanh đen */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow-x: hidden;
            color: #fff;
            padding: 20px;
        }

        /* --- CÁC KHỐI CHẤT LỎNG (LIQUID BLOBS) --- */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Không chặn click chuột */
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px); /* Tạo độ nhòe lan tỏa */
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #7b2cbf; /* Tím */
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: #4361ee; /* Xanh dương */
            animation-delay: -2s;
        }

        .blob-3 {
            bottom: 20%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: #f72585; /* Hồng neon nhấn nhá */
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 50px) rotate(20deg); }
        }

        /* --- THẺ KÍNH CHÍNH (MAIN GLASS CARD) --- */
        .glass-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05); /* Rất trong suốt */
            backdrop-filter: blur(20px); /* Hiệu ứng mờ kính */
            -webkit-backdrop-filter: blur(20px); /* Cho Safari */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Viền sáng nhẹ */
            border-top: 1px solid rgba(255, 255, 255, 0.5); /* Viền trên sáng hơn tạo khối */
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 50px;
            display: grid;
            grid-template-columns: 300px 1fr; /* Layout chia 2 cột */
            gap: 50px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease; /* Mượt mà khi tilt */
        }

        /* --- CỘT TRÁI (PROFILE) --- */
        .profile-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 20px;
        }

        .avatar-wrapper {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 5px;
            /* Viền gradient cho avatar */
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.2)); 
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1a1a2e; /* Khớp màu nền để tạo độ sâu */
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #fff, #b3c7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            margin-top: auto; /* Đẩy xuống dưới */
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* --- CỘT PHẢI (CONTENT) --- */
        .content-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h2 i {
            color: #4cc9f0; /* Màu icon tiêu đề */
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
        }

        /* --- KỸ NĂNG (Tags) --- */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            transition: 0.3s;
            cursor: default;
        }

        .skill-tag:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .projects-
